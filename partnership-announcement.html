<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novra Tech Partnership Announcement</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            padding: 20px;
        }

        .linkedin-post {
            width: 1200px;
            height: 1200px;
            background: linear-gradient(135deg, #003049 0%, #0a5a7a 50%, #003049 100%);
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 100px 70px;
            position: relative;
        }

        /* Premium Decorative background elements */
        .linkedin-post::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -8%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(247, 127, 0, 0.25) 0%, rgba(247, 127, 0, 0.05) 70%, transparent 100%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(40px);
        }

        .linkedin-post::after {
            content: '';
            position: absolute;
            bottom: -35%;
            left: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(102, 155, 188, 0.2) 0%, rgba(102, 155, 188, 0.03) 70%, transparent 100%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(50px);
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        /* Header Section */
        .header-section {
            margin-bottom: 20px;
            animation: slideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .brand-name {
            color: #F77F00;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(247, 127, 0, 0.3);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(247, 127, 0, 0.15), rgba(247, 127, 0, 0.05));
            border: 1.5px solid rgba(247, 127, 0, 0.5);
            color: #F77F00;
            padding: 10px 28px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Main Heading */
        .main-heading {
            margin: 30px 0 20px 0;
            animation: fadeInScale 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        .main-heading h1 {
            font-size: 140px;
            font-weight: 700;
            color: #EAE2B7;
            line-height: 1;
            text-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            letter-spacing: -4px;
            margin-bottom: 0;
            background: linear-gradient(135deg, #EAE2B7 0%, #F77F00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Graphic Section */
        .graphic-section {
            margin: 30px 0 20px 0;
            animation: bounceIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
        }

        .handshake-svg {
            width: 350px;
            height: 350px;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.4));
        }

        /* Subtitle */
        .sub-heading {
            margin-top: 20px;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }

        .sub-heading p {
            font-size: 32px;
            color: #EAE2B7;
            line-height: 1.6;
            font-weight: 500;
            max-width: 950px;
            letter-spacing: 0.2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        /* Company Names */
        .company-names {
            display: flex;
            gap: 60px;
            justify-content: center;
            margin-top: 40px;
            animation: fadeIn 1.2s ease-out 0.8s both;
        }

        .company-info {
            background: linear-gradient(135deg, rgba(234, 226, 183, 0.08), rgba(234, 226, 183, 0.03));
            padding: 22px 40px;
            border-radius: 8px;
            border: 1.5px solid rgba(247, 127, 0, 0.3);
            backdrop-filter: blur(30px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .company-info:hover {
            transform: translateY(-8px);
            border-color: rgba(247, 127, 0, 0.8);
            box-shadow: 0 12px 48px rgba(247, 127, 0, 0.15);
        }

        .company-info p {
            color: #EAE2B7;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 1;
            animation: slideUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) 1s both;
        }

        .social-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #F77F00;
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(247, 127, 0, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        .social-dot:nth-child(2) {
            background: #669BBC;
            box-shadow: 0 0 20px rgba(102, 155, 188, 0.6);
            animation-delay: 0.2s;
        }

        .social-dot:nth-child(3) {
            background: #EAE2B7;
            box-shadow: 0 0 20px rgba(234, 226, 183, 0.6);
            animation-delay: 0.4s;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounceIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.5;
            }
        }

        /* Responsive Design */
        @media (max-width: 1400px) {
            .linkedin-post {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
                padding: 60px 40px;
            }

            .main-heading h1 {
                font-size: 90px;
            }

            .sub-heading p {
                font-size: 24px;
            }
        }

        /* Print Style */
        @media print {
            body {
                background: white;
            }

            .linkedin-post {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="linkedin-post">
        <div class="content-wrapper">
            <!-- Header Section -->
            <div class="header-section">
                <div class="brand-name">Novra Tech</div>
                <div class="badge">Partnership Announcement</div>
            </div>

            <!-- Main Heading -->
            <div class="main-heading">
                <h1>Stronger Together</h1>
            </div>

            <!-- Handshake Graphic -->
            <div class="graphic-section">
                <svg class="handshake-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="leftGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#669BBC;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#003049;stop-opacity:0.8" />
                        </linearGradient>
                        <linearGradient id="rightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#F77F00;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#EAE2B7;stop-opacity:0.8" />
                        </linearGradient>
                        <filter id="shadow">
                            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
                        </filter>
                    </defs>

                    <!-- Background Circles for Emphasis -->
                    <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(247, 127, 0, 0.1)" stroke-width="2" opacity="0.6"/>
                    <circle cx="150" cy="150" r="110" fill="none" stroke="rgba(102, 155, 188, 0.08)" stroke-width="2" opacity="0.4"/>

                    <!-- Left Arm & Hand (Novra Tech) -->
                    <g id="left-side" filter="url(#shadow)">
                        <!-- Left Arm -->
                        <path d="M 40 140 Q 20 145 15 160 Q 12 170 20 175 L 60 160 Q 55 150 50 145 Z" fill="url(#leftGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                        
                        <!-- Left Hand Palm -->
                        <ellipse cx="85" cy="150" rx="28" ry="35" fill="url(#leftGradient)" stroke="#EAE2B7" stroke-width="1.5" transform="rotate(-25 85 150)"/>
                        
                        <!-- Left Hand Fingers -->
                        <g id="left-fingers">
                            <path d="M 75 120 Q 70 95 75 75 Q 78 70 82 75 Q 80 95 85 120 Z" fill="url(#leftGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                            <path d="M 85 115 Q 85 85 90 60 Q 93 55 97 60 Q 95 85 95 115 Z" fill="url(#leftGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                            <path d="M 95 118 Q 100 90 107 68 Q 110 62 114 68 Q 107 90 105 118 Z" fill="url(#leftGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                            <path d="M 105 120 Q 112 98 120 80 Q 123 75 127 82 Q 118 98 110 120 Z" fill="url(#leftGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                        </g>
                    </g>

                    <!-- Right Arm & Hand (Secura Global) -->
                    <g id="right-side" filter="url(#shadow)">
                        <!-- Right Arm -->
                        <path d="M 260 140 Q 280 145 285 160 Q 288 170 280 175 L 240 160 Q 245 150 250 145 Z" fill="url(#rightGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                        
                        <!-- Right Hand Palm -->
                        <ellipse cx="215" cy="150" rx="28" ry="35" fill="url(#rightGradient)" stroke="#EAE2B7" stroke-width="1.5" transform="rotate(25 215 150)"/>
                        
                        <!-- Right Hand Fingers -->
                        <g id="right-fingers">
                            <path d="M 225 120 Q 230 95 225 75 Q 222 70 218 75 Q 220 95 215 120 Z" fill="url(#rightGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                            <path d="M 215 115 Q 215 85 210 60 Q 207 55 203 60 Q 205 85 205 115 Z" fill="url(#rightGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                            <path d="M 205 118 Q 200 90 193 68 Q 190 62 186 68 Q 193 90 195 118 Z" fill="url(#rightGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                            <path d="M 195 120 Q 188 98 180 80 Q 177 75 173 82 Q 182 98 190 120 Z" fill="url(#rightGradient)" stroke="#EAE2B7" stroke-width="1.5"/>
                        </g>
                    </g>

                    <!-- Connection Point - Central Link -->
                    <g id="connection">
                        <circle cx="150" cy="150" r="24" fill="none" stroke="rgba(247, 127, 0, 0.3)" stroke-width="2"/>
                        <circle cx="150" cy="150" r="18" fill="#F77F00" opacity="0.95" stroke="#EAE2B7" stroke-width="2"/>
                        <circle cx="150" cy="150" r="12" fill="rgba(234, 226, 183, 0.4)"/>
                        
                        <!-- Inner Symbol -->
                        <g transform="translate(150, 150)">
                            <path d="M -6 -2 L 0 4 L 6 -2" fill="none" stroke="#EAE2B7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                    </g>

                    <!-- Network Connection Lines -->
                    <g id="network" opacity="0.7">
                        <!-- Top Network -->
                        <line x1="150" y1="50" x2="150" y2="85" stroke="#669BBC" stroke-width="2.5"/>
                        <circle cx="150" cy="40" r="7" fill="#669BBC" stroke="#EAE2B7" stroke-width="1.5"/>
                        
                        <!-- Bottom Network -->
                        <line x1="150" y1="215" x2="150" y2="250" stroke="#F77F00" stroke-width="2.5"/>
                        <circle cx="150" cy="260" r="7" fill="#F77F00" stroke="#EAE2B7" stroke-width="1.5"/>

                        <!-- Left Network Node -->
                        <line x1="95" y1="115" x2="75" y2="85" stroke="#669BBC" stroke-width="2" opacity="0.6"/>
                        <circle cx="70" cy="75" r="6" fill="#669BBC" stroke="#EAE2B7" stroke-width="1.5"/>

                        <!-- Right Network Node -->
                        <line x1="205" y1="115" x2="225" y2="85" stroke="#F77F00" stroke-width="2" opacity="0.6"/>
                        <circle cx="230" cy="75" r="6" fill="#F77F00" stroke="#EAE2B7" stroke-width="1.5"/>
                    </g>

                    <!-- Decorative Shine Effects -->
                    <ellipse cx="95" cy="130" rx="12" ry="18" fill="#EAE2B7" opacity="0.15"/>
                    <ellipse cx="205" cy="130" rx="12" ry="18" fill="#EAE2B7" opacity="0.15"/>
                </svg>
            </div>

            <!-- Subtitle -->
            <div class="sub-heading">
                <p>Novra Tech partners with Secura Global to enhance data security</p>
            </div>

            <!-- Company Names -->
            <div class="company-names">
                <div class="company-info">
                    <p>Novra Tech</p>
                </div>
                <div class="company-info">
                    <p>Secura Global</p>
                </div>
            </div>

            <!-- Footer Decorative Elements -->
            <div class="footer">
                <div class="social-dot"></div>
                <div class="social-dot"></div>
                <div class="social-dot"></div>
            </div>
        </div>
    </div>
</body>
</html>
