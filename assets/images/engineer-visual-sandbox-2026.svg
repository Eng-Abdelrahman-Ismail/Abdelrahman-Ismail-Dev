<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="45%" stop-color="#0e1d33"/>
      <stop offset="100%" stop-color="#0a162a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2440"/>
      <stop offset="100%" stop-color="#0c1a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="60%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#1b4f9c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#00d2ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#1c2f4a" stroke-opacity="0.4" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <rect width="1400" height="800" fill="url(#grid)" opacity="0.35"/>
  <rect width="1400" height="800" fill="url(#glow)"/>

  <g opacity="0.6" stroke="url(#accent)" stroke-width="1.4" fill="none">
    <path d="M120 540L300 500L470 530L640 460L830 510L1040 430L1240 460"/>
    <path d="M160 420L330 370L520 400L700 330L900 370L1120 300L1280 320"/>
    <path d="M200 300L380 260L560 290L740 230L940 260L1150 210L1320 230"/>
  </g>

  <g filter="url(#soft-glow)">
    <g fill="#00d2ff" opacity="0.95">
      <circle cx="300" cy="500" r="4"/>
      <circle cx="470" cy="530" r="4"/>
      <circle cx="640" cy="460" r="4"/>
      <circle cx="830" cy="510" r="4"/>
      <circle cx="1040" cy="430" r="4"/>
      <circle cx="330" cy="370" r="3.5"/>
      <circle cx="520" cy="400" r="3.5"/>
      <circle cx="700" cy="330" r="3.5"/>
      <circle cx="900" cy="370" r="3.5"/>
      <circle cx="1120" cy="300" r="3.5"/>
      <circle cx="380" cy="260" r="3.2"/>
      <circle cx="560" cy="290" r="3.2"/>
      <circle cx="740" cy="230" r="3.2"/>
      <circle cx="940" cy="260" r="3.2"/>
      <circle cx="1150" cy="210" r="3.2"/>
    </g>
  </g>

  <g opacity="0.85">
    <rect x="170" y="160" width="360" height="180" rx="16" fill="url(#panel)" stroke="#1c3352"/>
    <rect x="210" y="205" width="220" height="8" rx="4" fill="url(#accent)"/>
    <rect x="210" y="225" width="260" height="8" rx="4" fill="#1f3a5c"/>
    <rect x="210" y="245" width="180" height="8" rx="4" fill="#1f3a5c"/>
  </g>

  <g opacity="0.85">
    <rect x="840" y="430" width="380" height="190" rx="18" fill="url(#panel)" stroke="#1c3352"/>
    <rect x="880" y="480" width="240" height="8" rx="4" fill="url(#accent)"/>
    <rect x="880" y="500" width="280" height="8" rx="4" fill="#1f3a5c"/>
    <rect x="880" y="520" width="220" height="8" rx="4" fill="#1f3a5c"/>
  </g>
