      <rect x="240" y="405" width="280" height="10" rx="5" fill="#1f3a5c"/>
      <rect x="240" y="430" width="240" height="10" rx="5" fill="#1f3a5c"/>
      <rect x="240" y="455" width="200" height="10" rx="5" fill="#1f3a5c"/>
      <rect x="240" y="480" width="260" height="10" rx="5" fill="#1f3a5c"/>
