  </g>

  <g opacity="0.9">
    <rect x="170" y="160" width="460" height="420" rx="24" fill="#0b1628" fill-opacity="0.7" stroke="#1c3352"/>
    <rect x="210" y="210" width="380" height="110" rx="18" fill="#101f36" stroke="#1c3352"/>
    <rect x="210" y="350" width="380" height="170" rx="18" fill="#101f36" stroke="#1c3352"/>

    <g opacity="0.8">
      <rect x="240" y="240" width="220" height="8" rx="4" fill="url(#accent)"/>
      <rect x="240" y="260" width="280" height="8" rx="4" fill="#1f3a5c"/>
      <rect x="240" y="280" width="180" height="8" rx="4" fill="#1f3a5c"/>
