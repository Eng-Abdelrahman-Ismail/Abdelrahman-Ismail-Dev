<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#0f1b30"/>
      <stop offset="100%" stop-color="#0a162a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="55%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#1b4f9c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#00d2ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1d2c45" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)" opacity="0.35"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <g opacity="0.65" stroke="url(#accent)" stroke-width="1.4" fill="none">
    <path d="M80 820L210 730L320 760L420 660L540 700L700 560"/>
    <path d="M100 640L240 560L360 590L470 500L610 540L740 450"/>
    <path d="M160 430L300 360L420 390L520 320L650 360L760 280"/>
  </g>

  <g filter="url(#soft-glow)">
    <g fill="#00d2ff" opacity="0.9">
      <circle cx="210" cy="730" r="4"/>
      <circle cx="320" cy="760" r="4"/>
      <circle cx="420" cy="660" r="4"/>
      <circle cx="540" cy="700" r="4"/>
      <circle cx="700" cy="560" r="4"/>
      <circle cx="240" cy="560" r="3.6"/>
      <circle cx="360" cy="590" r="3.6"/>
      <circle cx="470" cy="500" r="3.6"/>
      <circle cx="610" cy="540" r="3.6"/>
      <circle cx="740" cy="450" r="3.6"/>
      <circle cx="300" cy="360" r="3.2"/>
      <circle cx="420" cy="390" r="3.2"/>
      <circle cx="520" cy="320" r="3.2"/>
      <circle cx="650" cy="360" r="3.2"/>
      <circle cx="760" cy="280" r="3.2"/>
